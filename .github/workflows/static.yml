# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Creates the key file at the root of your repo
      # After deploy, it will be at: https://vanta-forge.github.io/Vanta-Forge/YOUR-KEY.txt
      - name: Create IndexNow key file
        run: echo "${{ secrets.INDEXNOW_KEY }}" > ./${{ secrets.INDEXNOW_KEY }}.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Submits your 2 pages to Bing IndexNow
      - name: Submit URLs to IndexNow
        run: |
          curl -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "vanta-forge.github.io",
              "key": "${{ secrets.INDEXNOW_KEY }}",
              "keyLocation": "https://vanta-forge.github.io/Vanta-Forge/${{ secrets.INDEXNOW_KEY }}.txt",
              "urlList": [
                "https://vanta-forge.github.io/Vanta-Forge/",
                "https://vanta-forge.github.io/Vanta-Forge/community"
              ]
            }'
